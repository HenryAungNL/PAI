# Serves the built PAI single-page app and reverse-proxies API traffic to the
# Django backend. This file is included inside the http{} block of nginx.conf.

upstream pai_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Container healthcheck target (does not touch the backend).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend health passthrough.
    location = /health {
        proxy_pass http://pai_backend/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API, schema, docs and the debug Django admin.
    location /api/ {
        proxy_pass http://pai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # User uploads (served by Django while DEBUG=True in the demo compose).
    location /media/ {
        proxy_pass http://pai_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin static assets (whitenoise / collectstatic).
    location /static/ {
        proxy_pass http://pai_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed files under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entry point so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: serve real files, otherwise hand back index.html so the
    # client-side router can resolve deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
